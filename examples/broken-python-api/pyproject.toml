[project]
name = "broken-python-api"
version = "0.1.0"
description = "Deliberately broken order domain fixture for repair experiments."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
